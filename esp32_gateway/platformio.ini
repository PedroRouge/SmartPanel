[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    tool-esptoolpy@2.41100.260830
    toolchain-riscv32-esp@8.4.0+2021r2-patch5
    toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
monitor_speed = 115200
upload_speed = 921600

; -----------------------------------------------------------------------
; PARTICIÓN FLASH: huge_app.csv asigna 3 MB al binario de la app.
; OBLIGATORIO con Firebase SSL + ArduinoJson + IRremote (binario ~1.4 MB).
; Sin esto, la compilación falla con "app partition size exceeded".
; -----------------------------------------------------------------------
board_build.partitions = huge_app.csv

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=2

lib_deps =
    https://github.com/mobizt/Firebase-ESP-Client.git#3d2629898db4cd8f9460b0558e84987e696d6a43
    bblanchon/ArduinoJson @ 7.4.3
    crankyoldgit/IRremoteESP8266 @ 2.9.0
