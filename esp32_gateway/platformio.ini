[platformio]
default_envs = esp32-s3-devkitc-1-n16r8

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1-n16r8
framework = arduino
extra_scripts = pre:scripts/patch_firebase_auth_retry.py
# N16R8: 16 MB QSPI flash + 8 MB OPI PSRAM.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
platform_packages =
    framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    tool-esptoolpy@2.41100.260830
    toolchain-riscv32-esp@8.4.0+2021r2-patch5
    toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
monitor_speed = 115200
upload_speed = 921600

; -----------------------------------------------------------------------
; PARTICIÓN FLASH: 2 particiones OTA de 3 MB (app0 y app1) + otadata.
; OBLIGATORIO con Firebase SSL + ArduinoJson + mTLS.
; -----------------------------------------------------------------------
board_build.partitions = huge_app.csv

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=2

lib_deps =
    https://github.com/mobizt/Firebase-ESP-Client.git#3d2629898db4cd8f9460b0558e84987e696d6a43
    bblanchon/ArduinoJson @ 7.4.3

; -----------------------------------------------------------------------
; ENTORNO OTA: Flasheo inalámbrico por Wi-Fi sin cable USB
; Uso: pio run -e esp32-s3-ota -t upload
; -----------------------------------------------------------------------
[env:esp32-s3-ota]
extends = env:esp32-s3-devkitc-1-n16r8
upload_protocol = espota
upload_port = 192.168.0.201
upload_flags =
    --port=3232
    --auth=SmartPanelOTA2026
