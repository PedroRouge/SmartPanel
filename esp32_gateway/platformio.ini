[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; -----------------------------------------------------------------------
; PARTICIÓN FLASH: huge_app.csv asigna 3 MB al binario de la app.
; OBLIGATORIO con Firebase SSL + ArduinoJson + IRremote (binario ~1.4 MB).
; Sin esto, la compilación falla con "app partition size exceeded".
; -----------------------------------------------------------------------
board_build.partitions = huge_app.csv

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=2

lib_deps =
    mobizt/Firebase ESP Client @ ^4.4.14
    bblanchon/ArduinoJson @ ^7.0.4
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
