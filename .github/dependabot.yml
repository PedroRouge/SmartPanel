version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      quality-toolchain:
        patterns:
          - "@firebase/*"
          - "@playwright/*"
          - "firebase"
          - "firebase-tools"

  - package-ecosystem: pip
    directory: "/tools/android_tv_pairing"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
